.wrap{max-width:720px;margin:0 auto;padding:22px 16px 80px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chk,.tab,.pill,.glass,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.bulbs{height:12px;margin:0 0 12px;background:radial-gradient(circle,var(--amber) 0 3px,transparent 3.5px) 0 center/22px 12px repeat-x;filter:drop-shadow(0 0 4px rgba(217,164,65,.7))}
.hero{border-radius:10px;overflow:hidden;border:2px solid #2b1a20}
.hero svg{display:block;width:100%;height:130px}
header .kick{font-family:var(--type);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-top:16px}
h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(34px,8.5vw,52px);line-height:1.05;margin:6px 0 8px;color:var(--text);text-shadow:3px 3px 0 #8a1426;text-wrap:balance}
.lead{color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;border-top:3px solid var(--red)}
.stat b{font-variant-numeric:tabular-nums;font-size:21px;font-family:var(--type);font-weight:400}
.stat span{display:block;font-family:var(--type);font-size:12.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.bar{height:6px;border-radius:0;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--red) 0 8px,#b0192f 8px 10px);transition:width .3s}
.st{font-family:var(--type);font-size:13px;color:var(--muted);text-align:right;min-height:18px;margin-top:6px}

nav.tabs{position:sticky;top:0;z-index:5;margin:10px -16px 16px;padding:10px 16px;background:linear-gradient(var(--bg) 72%,transparent);
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:58px;padding:8px 12px;border-radius:6px;border:1.5px dashed var(--line);background:var(--bg2);text-align:center;line-height:1.15}
.tab small{display:block;font-family:var(--type);font-size:11.5px;color:var(--muted);margin-top:2px}
.tab b{font-family:var(--type);font-weight:400;font-size:16px}
.tab .pips{display:flex;gap:3px;justify-content:center;margin-top:5px}
.tab .pips u{width:6px;height:6px;border-radius:50%;background:var(--line);text-decoration:none}
.tab .pips u.on{background:var(--c,var(--amber))}
.tab[aria-selected="true"]{border:1.5px solid var(--c,var(--amber));border-style:solid;background:var(--card);box-shadow:0 0 0 1px var(--c,var(--amber)) inset}

.panel{display:flex;flex-direction:column;gap:14px}
.poster{border-radius:8px;overflow:hidden;border:2px solid #2b1a20;background:var(--ink)}
.poster::before,.poster::after{content:"";display:block;height:14px;background:repeating-linear-gradient(90deg,transparent 0 6px,var(--text) 6px 14px,transparent 14px 20px) center/auto 6px no-repeat,var(--ink)}
.poster svg{display:block;width:100%;height:auto}
.poster figcaption{display:none}
.hero-name{font-family:var(--type);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
.hero-name b{color:var(--ac,var(--amber));font-weight:400}
.dayhead .dn{font-family:var(--type);font-size:14px;letter-spacing:.2em;color:var(--ac);text-transform:uppercase}
.dayhead h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(26px,6vw,34px);line-height:1.15;margin:4px 0;text-wrap:balance;border-bottom:3px solid var(--ac);padding-bottom:6px;display:inline-block}
.dayhead p{color:var(--muted);font-style:italic;margin-top:6px}

.tasks{list-style:none;display:flex;flex-direction:column;gap:12px}
.task{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:6px;padding:14px 14px 14px 12px;transition:border-color .2s}
.task.done{background:#1b141b}
.task.done .ttitle{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ac)}
.chk{position:relative;flex:0 0 44px;height:44px;display:block;cursor:pointer}
.chk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.box{position:absolute;inset:0;border:3px solid var(--ac,var(--amber));border-radius:8px;background:rgba(239,227,200,.04);display:grid;place-items:center;transition:background .15s}
.box svg{width:26px;height:26px;stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:all .15s}
.chk input:checked + .box{background:var(--ac,var(--amber))}
.chk input:checked + .box svg{opacity:1;transform:scale(1)}
.chk input:focus-visible + .box{outline:3px solid var(--cyan);outline-offset:2px}
.tbody{flex:1;min-width:0}
.tmeta{display:flex;gap:10px;align-items:baseline;font-family:var(--type);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.tmeta .time{color:var(--muted);letter-spacing:.08em}
.ttitle{font-size:19px;font-weight:600;line-height:1.25;margin:3px 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:4px;border:1.5px solid var(--line);font-family:var(--type);font-size:14.5px;color:var(--text);background:rgba(239,227,200,.04);min-height:36px}
.pill[aria-expanded="true"]{border-color:var(--ac);color:var(--ac)}
.pill.filled{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.desc{margin-top:10px;color:#e3d8be;font-size:16px;max-width:62ch}
.note{margin-top:10px}
.note textarea{width:100%;min-height:110px;resize:none;overflow:hidden;background:rgba(0,0,0,.45);color:var(--text);
  border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font:inherit;font-size:16.5px;line-height:1.5}
.note textarea:focus{border-color:var(--ac);outline:none}
.wc{font-family:var(--type);font-size:12.5px;color:var(--muted);text-align:right;margin-top:4px}
.min{background:rgba(239,227,200,.06);border-radius:6px;padding:11px 14px;font-size:15px;color:#e3d8be;border:1px dashed var(--line)}
.min b{color:var(--ac);font-family:var(--type);font-weight:400}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 14px}
.card h3{font-family:var(--display);font-style:italic;font-size:23px;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:14.5px;margin-bottom:10px}
.dayrow,.habit .cells,.moodrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dayrow{font-family:var(--type);font-size:13px;color:var(--amber);letter-spacing:.08em;margin:6px 0 2px}
.dayrow span small{display:block;color:var(--muted)}
.habit{padding:11px 0;border-top:1px solid var(--line)}
.habit .hn{font-weight:600;font-size:16.5px}
.habit .hs{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.habit .cells .chk{flex:none;width:100%;max-width:42px;height:42px;margin:0 auto}
.habit .cells .box{border-radius:7px;--ac:var(--amber)}
.moodcell{display:flex;flex-direction:column;gap:3px;align-items:center}
.moodcell button{width:30px;height:20px;border-radius:4px;border:1.5px solid var(--line);font-family:var(--type);font-size:12px;color:var(--muted)}
.moodcell button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--ink)}
.moodrow{margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0;font-size:13.5px;color:var(--muted)}
.chip{padding:6px 11px;border-radius:4px;border:1.5px solid var(--line);font-family:var(--type);font-size:14px;color:var(--text);min-height:32px}
.chip[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.wrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.wrow .wd{flex:0 0 26px;font-family:var(--type);font-size:13px;color:var(--amber)}
.wrow.today .wd{color:var(--cyan)}
.glasses{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.glass{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--cyan);background:rgba(127,211,214,.06);transition:background .15s}
.glass[aria-pressed="true"]{background:var(--cyan)}
.wrow .wn{flex:0 0 58px;text-align:right;font-family:var(--type);font-size:13px;color:var(--muted)}
.wrow.full .wn{color:var(--cyan)}

.fin label.t{display:block;font-family:var(--type);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:14px 0 6px}
.fin textarea{width:100%;min-height:84px;resize:none;overflow:hidden;background:rgba(0,0,0,.45);color:var(--text);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font:inherit;font-size:16.5px}
.fin textarea:focus{border-color:var(--cyan);outline:none}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.score div{background:rgba(239,227,200,.05);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--muted)}
.score b{display:block;font-family:var(--type);font-weight:400;font-size:24px;color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{padding:11px 18px;border-radius:6px;background:var(--red);color:var(--ink);font-weight:700;min-height:44px}
details.all{border-top:1px solid var(--line);padding:10px 0}
details.all summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.all summary::-webkit-details-marker{display:none}
details.all summary::after{content:'+';color:var(--amber);font-size:20px;line-height:1}
details.all[open] summary::after{content:'–'}
details.all .entry{margin-top:10px;font-size:15.5px;color:#e3d8be;white-space:pre-wrap}
.copybox{width:100%;margin-top:10px;min-height:140px;background:rgba(0,0,0,.45);color:var(--text);border:1.5px solid var(--line);border-radius:6px;padding:12px;font:inherit;font-size:14px}
.foot{margin-top:26px;color:var(--muted);font-size:13.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.tab{min-width:52px;padding:8px 9px}.task{padding:12px 10px}}

var KEY="k2s-week1-v1";

if(!S.w)S.w={};if(!S.ws)S.ws={ml:250,goal:1500};

  [1500,2000,2500].forEach(function(v){h+='<button class="chip" data-wgoal="'+v+'" aria-pressed="'+(S.ws.goal===v)+'">'+fmtL(v)+' л</button>'});
  h+='</div>';
  for(var d=0;d<7;d++){
    var cnt=S.w[d]||0;
    h+='<div class="wrow'+(d===diff?" today":"")+(cnt>=n?" full":"")+'"><span class="wd">'+WD[d]+'</span><div class="glasses">';

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function words(t){t=(t||"").trim();return t?t.split(/\s+/).length:0}

function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));setStatus("Сохранено на этом устройстве")}
  catch(e){setStatus("Не удалось сохранить: браузер блокирует память")}
}

function stats(){
  var b=0,c=0,k;
  for(k in S.c){if(!S.c[k])continue;if(k.charAt(0)==="b")b++;else if(k.charAt(0)==="d")c++}
  $("#s1").textContent=b+" / 56";$("#s2").textContent=c+" / 28";
  $("#b1").style.width=(b/56*100)+"%";$("#b2").style.width=(c/28*100)+"%";
}
function dayDone(i){var n=0;for(var j=0;j<4;j++)if(S.c["d"+i+"t"+j])n++;return n}

  DAYS.forEach(function(d,i){
    var n=dayDone(i),p="";
    for(var j=0;j<4;j++)p+='<u class="'+(j<n?"on":"")+'"></u>';
    h+='<button class="tab" role="tab" style="--c:'+d.ac+'" aria-selected="'+(tab===i+1)+'" data-tab="'+(i+1)+'"><b>'+d.d+'</b><small>'+d.date.split(" ")[0]+'</small><span class="pips">'+p+'</span></button>';
  });
  h+='<button class="tab" role="tab" aria-selected="'+(tab===8)+'" data-tab="8"><b>Итоги</b><small>22 ноя</small></button>';
  $("#tabs").innerHTML=h;

function updatePips(){
  document.querySelectorAll('.tab[data-tab]').forEach(function(t){
    var i=+t.dataset.tab;if(i<1||i>7)return;
    var n=dayDone(i-1),u=t.querySelectorAll('.pips u');
    for(var j=0;j<u.length;j++)u[j].classList.toggle('on',j<n);
  });
}

function viewDay(i){
  var D=DAYS[i];
  var h=poster(i,HERO[i],D.ac)+'<div class="dayhead" style="--ac:'+D.ac+'"><div class="dn">'+D.d+' · '+D.date+'</div><h2>'+D.title+'</h2><p>'+D.quote+'</p></div><ul class="tasks" style="--ac:'+D.ac+'">';
  D.tasks.forEach(function(t,j){
    var id="d"+i+"t"+j,done=!!S.c[id],txt=S.n[id]||"",w=words(txt);
    h+='<li class="task'+(done?" done":"")+'" style="--ac:'+D.ac+'" data-id="'+id+'">'+chk(id,done,D.ac)+
      '<div class="tbody"><div class="tmeta"><span>'+t[0]+'</span><span class="time">'+t[1]+'</span></div>'+
      '<div class="ttitle">'+t[2]+'</div><div class="acts">'+
      '<button class="pill" data-desc="'+id+'" aria-expanded="'+(!!openDesc[id])+'">Задание</button>'+
      '<button class="pill'+(w?" filled":"")+'" data-note="'+id+'" aria-expanded="'+(!!openNote[id])+'">✎ Писать'+(w?" · "+w+" сл.":"")+'</button></div>'+
      '<p class="desc"'+(openDesc[id]?"":" hidden")+'>'+esc(t[3])+'</p>'+
      '<div class="note"'+(openNote[id]?"":" hidden")+'><textarea data-n="'+id+'" placeholder="'+esc(PH[t[0]])+'" aria-label="Запись: '+esc(t[2])+'">'+esc(txt)+'</textarea><div class="wc">'+w+' сл.</div></div></div></li>';
  });
  h+='</ul><div class="min" style="--ac:'+D.ac+'"><b>Минимум:</b> '+D.min+'</div>';

function summary(){
  var out=[];
  DAYS.forEach(function(D,i){D.tasks.forEach(function(t,j){var id="d"+i+"t"+j;if((S.n[id]||"").trim())out.push({h:D.d+" "+D.date+" · "+t[0]+": "+t[2],t:S.n[id].trim()})})});
  if((S.x.best||"").trim())out.push({h:"Лучшая строка недели",t:S.x.best.trim()});
  if((S.x.rev||"").trim())out.push({h:"Что зашло / что поменять",t:S.x.rev.trim()});
  return out;
}

function viewFin(){
  var days=0,base=0,i,r,d,k;
  for(i=0;i<7;i++){if(S.c["d"+i+"t0"])days++}
  for(d=0;d<7;d++){var n=0;for(r=0;r<8;r++)if(S.c["b"+r+"_"+d])n++;if(n>=5)base++}
  var h=poster(8)+'<div class="card fin" style="--ac:#d9a441"><h3>Итоги недели</h3><p class="hint">Награда за прохождение. Тебе есть чем гордиться.</p>';
  FIN.forEach(function(f,j){var id="f"+j;h+='<div class="task'+(S.c[id]?" done":"")+'" style="--ac:#d9a441;margin-bottom:10px">'+chk(id,S.c[id],"#d9a441")+'<div class="tbody"><div class="tmeta"><span>'+f[0]+'</span></div><div class="ttitle" style="margin-bottom:0">'+f[1]+'</div></div></div>'});
  h+='<div class="score"><div><b id="sc1">'+days+' / 7</b>дней с текстом</div><div><b id="sc2">'+base+' / 7</b>дней с основой (5 из 8 и больше)</div></div>';
  h+='<label class="t" for="best">Лучшая строка недели</label><textarea id="best" data-x="best">'+esc(S.x.best||"")+'</textarea>';
  h+='<label class="t" for="rev">Что зашло, что поменять</label><textarea id="rev" data-x="rev">'+esc(S.x.rev||"")+'</textarea>';
  var all=summary();
  h+='<div class="row"><button class="btn" data-copy="1">Скопировать все записи</button></div><div id="cp"></div><div class="row"><button class="btn" data-bk="1">Копия данных</button><button class="btn" data-rs="1">Восстановить из копии</button></div><div id="bk"></div>';
  h+='<div style="margin-top:14px"><h3 style="font-size:18px">Все мои записи</h3>';
  if(!all.length)h+='<p class="hint" style="margin-top:6px">Пока пусто. Записи появятся здесь, свёрнутыми.</p>';
  all.forEach(function(e){h+='<details class="all"><summary>'+esc(e.h)+'</summary><div class="entry">'+esc(e.t)+'</div></details>'});
  h+='</div></div>';
  return h;
}

function render(){
  renderTabs();
  $("#view").innerHTML=tab===0?viewBase():(tab===8?viewFin():viewDay(tab-1));
  $("#view").querySelectorAll("textarea").forEach(fit);
  stats();
}
function fit(t){t.style.height="auto";t.style.height=Math.max(t.scrollHeight+2,t.classList.contains("x")?0:84)+"px"}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-desc],[data-note],[data-m],[data-copy],[data-w],[data-wml],[data-wgoal],[data-bk],[data-rs],[data-ap]");
  if(!el)return;
  if(el.dataset.w){var wp=el.dataset.w.split("_"),wd=+wp[0],wk=+wp[1],cur=S.w[wd]||0;S.w[wd]=(cur===wk+1)?wk:wk+1;wSync();persist();refreshWater();return}
  if(el.dataset.bk){
    var js=JSON.stringify(S),bx=$("#bk");
    function man2(){bx.innerHTML='<textarea class="copybox" readonly aria-label="Копия данных"></textarea>';var c2=bx.firstChild;c2.value=js;c2.focus();c2.select()}
    try{navigator.clipboard.writeText(js).then(function(){bx.innerHTML='<p class="hint" style="margin-top:8px">Копия скопирована. Сохрани её в заметки или отправь себе.</p>'}).catch(man2)}catch(er){man2()}
    return}
  if(el.dataset.rs){$("#bk").innerHTML='<textarea class="copybox" id="rt" placeholder="Вставь сюда копию данных"></textarea><div class="row"><button class="btn" data-ap="1">Применить</button></div>';$("#rt").focus();return}
  if(el.dataset.ap){
    try{var pr=JSON.parse($("#rt").value);if(!pr||typeof pr!=="object")throw 0;
      S=Object.assign({c:{},n:{},m:{},x:{},w:{},ws:{ml:250,goal:1500}},pr);persist();render();
    }catch(er){$("#bk").insertAdjacentHTML("beforeend",'<p class="hint" style="margin-top:8px">Не получилось прочитать копию. Вставь её целиком.</p>')}
    return}
  if(el.dataset.wml){S.ws.ml=+el.dataset.wml;wSync();persist();refreshWater();return}
  if(el.dataset.wgoal){S.ws.goal=+el.dataset.wgoal;wSync();persist();refreshWater();return}
  if(el.dataset.tab!==undefined){tab=+el.dataset.tab;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(el.dataset.desc){var id=el.dataset.desc;openDesc[id]=!openDesc[id];var li=el.closest(".task");li.querySelector(".desc").hidden=!openDesc[id];el.setAttribute("aria-expanded",!!openDesc[id]);return}
  if(el.dataset.note){var id2=el.dataset.note;openNote[id2]=!openNote[id2];var li2=el.closest(".task");var nb=li2.querySelector(".note");nb.hidden=!openNote[id2];el.setAttribute("aria-expanded",!!openNote[id2]);if(openNote[id2]){var ta=nb.querySelector("textarea");fit(ta);ta.focus()}return}
  if(el.dataset.m){var p=el.dataset.m.split("_"),d=+p[0],v=+p[1];if(S.m[d]===v)delete S.m[d];else S.m[d]=v;persist();document.querySelectorAll('[data-m^="'+d+'_"]').forEach(function(bt){bt.setAttribute("aria-pressed",S.m[d]===+bt.dataset.m.split("_")[1])});return}
  if(el.dataset.copy){
    var t=summary().map(function(e){return e.h+"\n"+e.t}).join("\n\n");
    var box=$("#cp");
    function manual(){box.innerHTML='<textarea class="copybox" readonly aria-label="Все записи"></textarea>';var c=box.firstChild;c.value=t||"Пока нет записей.";c.focus();c.select()}
    if(!t){manual();return}
    try{navigator.clipboard.writeText(t).then(function(){box.innerHTML='<p class="hint" style="margin-top:8px">Скопировано.</p>'}).catch(manual)}catch(err){manual()}
  }
});

document.addEventListener("change",function(e){
  var c=e.target.getAttribute&&e.target.getAttribute("data-c");
  if(!c)return;
  S.c[c]=e.target.checked;
  var li=e.target.closest(".task");if(li)li.classList.toggle("done",e.target.checked);
  persist();stats();updatePips();
  if(tab===8){var days=0,base=0,i,r,d;for(i=0;i<7;i++)if(S.c["d"+i+"t0"])days++;for(d=0;d<7;d++){var n=0;for(r=0;r<8;r++)if(S.c["b"+r+"_"+d])n++;if(n>=5)base++}$("#sc1").textContent=days+" / 7";$("#sc2").textContent=base+" / 7"}
});

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.n){
    S.n[t.dataset.n]=t.value;fit(t);
    var w=words(t.value),li=t.closest(".task");
    li.querySelector(".wc").textContent=w+" сл.";
    var b=li.querySelector("[data-note]");b.classList.toggle("filled",w>0);b.textContent="✎ Писать"+(w?" · "+w+" сл.":"");
    persist();
  }else if(t.dataset&&t.dataset.x){S.x[t.dataset.x]=t.value;fit(t);persist()}
});

(function init(){
  var diff=Math.floor((new Date()-new Date(2026,10,16))/864e5);
  tab=(diff>=0&&diff<=6)?diff+1:0;
  $("#hero").innerHTML=heroSVG();
  render();
})();
</script>
</body>
</html>
